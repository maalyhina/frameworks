security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    role_hierarchy:
        ROLE_MANAGER: ROLE_CLIENT
        ROLE_ADMIN: ROLE_MANAGER

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        login:
            pattern: ^/api/login
            stateless: true
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/
            stateless: true
            jwt: ~

    access_control:
        - { path: ^/api/(login|register), roles: PUBLIC_ACCESS }
        - { path: ^/api/me, roles: ROLE_CLIENT }
        - { path: ^/orders, methods: [POST], roles: ROLE_CLIENT }
        - { path: ^/, methods: [GET], roles: ROLE_CLIENT }
        - { path: ^/, methods: [DELETE], roles: ROLE_ADMIN }
        - { path: ^/, methods: [POST, PUT, PATCH], roles: ROLE_MANAGER }